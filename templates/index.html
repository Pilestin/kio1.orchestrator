<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIO1 Orchestrator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>KIO1 Orchestrator</h1>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <p id="upload-status" class="upload-status" role="status"></p>

    <div class="upload-bar">
      <label class="upload-button">
        Model
        <input id="file-input-model" class="upload-input" type="file" data-category="model">
      </label>
      <label class="upload-button">
        Dataset
        <input id="file-input-dataset" class="upload-input" type="file" data-category="dataset">
      </label>
      <label class="upload-button">
        File
        <input id="file-input-file" class="upload-input" type="file" data-category="file">
      </label>
    </div>

    <form id="chat-form" class="chat-form">
      <textarea id="query-input" placeholder="Ask Ai4SwEng..." rows="1" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
