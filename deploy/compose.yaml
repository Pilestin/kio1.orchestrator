name: kio1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kio1
      POSTGRES_USER: kio1
      POSTGRES_PASSWORD: kio1
    ports:
      - "5432:5432"
    volumes:
      - kio1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kio1 -d kio1"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    # JetStream is enabled so the broker is ready for durable delivery, even
    # though KIO1 currently uses core request/reply.
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  session-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - uvicorn
      - services.session_manager.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      KIO1_DATABASE_URL: postgresql://kio1:kio1@postgres:5432/kio1
    ports:
      - "8001:8001"
    volumes:
      # config.json and the prompt are baked into the image by the Dockerfile,
      # which would mean rebuilding to change a setting. Mounting them means an
      # edit needs only `docker compose restart`. Read-only: a service must not
      # rewrite the file its operator owns.
      - ../config.json:/app/config.json:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy

  workflow-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      KIO1_SESSION_MANAGER_URL: http://session-manager:8001
      # config.json addresses the model and the agents as 127.0.0.1, which
      # inside a container means the container itself. These redirect them to
      # the developer machine, where Ollama and the KIO agents actually run.
      # KIO1_AGENT_HOST rehosts every agent at once, so registering another
      # one needs no change here; KIO1_AGENT_ENDPOINT_<ID> overrides a single
      # agent that lives somewhere else.
      KIO1_PROVIDER_ENDPOINT: http://host.docker.internal:11434
      KIO1_AGENT_HOST: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      # config.json and the prompt are baked into the image by the Dockerfile,
      # which would mean rebuilding to change a setting. Mounting them means an
      # edit needs only `docker compose restart`. Read-only: a service must not
      # rewrite the file its operator owns.
      - ../config.json:/app/config.json:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      session-manager:
        condition: service_started
      nats:
        condition: service_healthy
    # Resolves host.docker.internal on Linux hosts, where it is not built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kio1-postgres:
